# xdg-desktop-portal's per-desktop choice for XDG_CURRENT_DESKTOP=quire (read as
# <desktop>-portals.conf from $XDG_DATA_DIRS/xdg-desktop-portal/). Interim: xdg-desktop-portal-wlr
# serves ScreenCast and Screenshot until casement's own portal replaces it (plan P2). The wlr portal's
# own file names the wlroots desktops in UseIn, not quire; this explicit choice makes it
# serve quire without editing that package's file.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Settings=gtk
