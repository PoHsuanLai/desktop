# xdg-desktop-portal's per-desktop choice for XDG_CURRENT_DESKTOP=quire (read as
# <desktop>-portals.conf from $XDG_DATA_DIRS/xdg-desktop-portal/). transom (the `quire` portal
# implementation, transom/dist/quire.portal) answers screen sharing, screenshots, remote desktop,
# settings and the keep-awake inhibit; it has no file chooser, so the GTK implementation keeps that and
# anything else transom does not serve (the default line is tried in order).
# The explicit lines repeat the interfaces transom lists in its portal file; scenarios/portal-quire.sh
# checks the two agree.
[preferred]
default=quire;gtk
org.freedesktop.impl.portal.ScreenCast=quire
org.freedesktop.impl.portal.Screenshot=quire
org.freedesktop.impl.portal.RemoteDesktop=quire
org.freedesktop.impl.portal.Settings=quire
org.freedesktop.impl.portal.Inhibit=quire
org.freedesktop.impl.portal.FileChooser=gtk
