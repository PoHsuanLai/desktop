# The desktop's portal backend (transom) accepts the portal frontend, xdg-desktop-portal, only when its unit throws away every
# variable that makes a program load code its image does not name (peephole's LOADER_VARIABLES): `systemctl --user set-environment`
# and ~/.config/environment.d put them in the environment of every user unit, and the frontend runs as the person. This
# drop-in is root-held (installed under /etc/systemd/user, or in a release under /usr/lib/systemd/user), which is why it counts;
# the distro's own unit does not have the line. gate/check-loader-unset.sh keeps the list equal to peephole's.
[Service]
UnsetEnvironment=LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT GCONV_PATH GIO_EXTRA_MODULES GTK_MODULES GTK_PATH GST_PLUGIN_PATH GST_PLUGIN_SYSTEM_PATH LIBGL_DRIVERS_PATH MESA_LOADER_DRIVER_OVERRIDE __EGL_VENDOR_LIBRARY_DIRS __EGL_VENDOR_LIBRARY_FILENAMES GBM_BACKENDS_PATH LIBVA_DRIVERS_PATH VK_ICD_FILENAMES VK_DRIVER_FILES VK_ADD_DRIVER_FILES VK_LAYER_PATH VK_ADD_LAYER_PATH VK_INSTANCE_LAYERS VK_LOADER_LAYERS_ENABLE
