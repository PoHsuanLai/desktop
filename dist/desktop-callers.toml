# The memory service.
[[peer]]
app  = "org.quire.Memory"
unit = "memoryd.service"
exe  = [
  "/opt/quire/releases/*/libexec/quire/memoryd",
  "/opt/quire/current/libexec/quire/memoryd",
  "/usr/local/libexec/quire/memoryd",
  "/usr/libexec/quire/memoryd",
]
role = "memory"

# May create security contexts for the sandboxes it starts. A program: no unit.
[[peer]]
app  = "org.quire.Flatpak"
exe  = [
  "/usr/bin/flatpak",
]
role = "sandbox_launcher"

# The unit manager: its answers about units are believed only from this image. A program: no unit.
[[peer]]
app  = "org.freedesktop.systemd1"
exe  = [
  "/usr/lib/systemd/systemd",
  "/lib/systemd/systemd",
]
role = "manager"
