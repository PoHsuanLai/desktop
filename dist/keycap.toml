# The desktop's vendor settings for keycap, the keyboard mapping: /usr/lib/keycap/keycap.toml.
#
# Caps Lock switches the input method (Ctrl+Space). A rule on a key pressed alone is refused when it arrives
# from a person's own file over the socket (anyone's program could type with it), so it lives in a file only
# root can write. This one is the vendor file: it lays over keycap's built-in mapping and under the
# administrator's /etc/keycap/keycap.toml, so only the difference is listed. Every install and release
# replaces it; change the rule in /etc/keycap/keycap.toml, which is never touched.

[profile.default]
rules = [
  { when = "capslock", then = "ctrl+space" },
]
