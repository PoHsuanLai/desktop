# Builds the signed release bundle of the whole desktop at manifest.toml's pins and publishes it to the
# public PoHsuanLai/desktop-releases (binaries only; the source repos are private). release/README.md says
# what the owner sets up once. Secrets: RELEASE_READ_TOKEN (read the private repos; a repository secret, read-only),
# and, in two GitHub environments that only the default branch and version tags may use and that need a reviewer:
# `release-signing` holds MINISIGN_SECRET_KEY and MINISIGN_PASSWORD (job pack), `release-publish` holds
# RELEASES_TOKEN (job publish). A workflow run from any other branch cannot reach the signing key, and the repository
# holds no copy of it outside the environment.
#
# The programs are built on Ubuntu 24.04 (a container pinned by digest, so what gets signed is not built on whatever the
# tag names that day; bump it on purpose, `docker buildx imagetools inspect ubuntu:24.04` prints the digest), the oldest
# base the desktop supports: glibc 2.39, GCC 13's libstdc++, noble's libinput, wayland, pipewire), so they load on Fedora and Arch too; a build
# on a newer base would not load on Ubuntu. After the build, release/check-glibc.sh and check-ldd.sh fail the job
# if a program asks for a newer C library than that or a library that is not there. The signed result is then
# installed by slipway's helper in clean ubuntu:24.04, fedora:44 and archlinux:latest containers (job smoke),
# and the start check's two scenarios run (job health), before anything is published.
#
# Jobs: prepare -> build (parallel, per component group) -> pack (merge, sign, verify) -> smoke (three
# distributions) and health (start check scenarios) -> publish (create the release in desktop-releases).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v (for example 0.2.0)
        required: true
        type: string
      notes:
        description: Release notes (plain text)
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version and the notes, from the inputs or from the tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Only the default branch or a version tag releases
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A second line of defence: the environments below are what actually keeps the signing key from a branch.
          case "$REF" in
            "refs/heads/$DEFAULT_BRANCH" | refs/tags/v*) ;;
            *) echo "release: $REF is not the default branch or a version tag" >&2; exit 1 ;;
          esac

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then version=${REF_NAME#v}; else version=$INPUT_VERSION; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a semver: $version" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    # The oldest supported base, not the runner image (which has newer toolchain pieces). Disk: the runner's
    # ~14 GB is shared with the container; the heavy components have a job each for that reason (unverified
    # that casement and sill fit; if not, free space cannot be reclaimed from inside the container).
    container: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: casement, only: casement }
          - { name: sill, only: sill }
          - { name: anyview, only: anyview }
          - { name: mailo, only: mailo }
          - { name: porter, only: porter }
          - { name: agents, only: "almanac,docket,stoker,cua" }
          - { name: small, only: "session,detent,transom,turnstile,keycap,palmrest,slipway,satellite" }
    steps:
      - name: Git and certificates (the checkout needs them)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop

      - name: Build tools and development packages (Ubuntu names, release/deps.sh)
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends $(desktop/release/deps.sh debian build)
          ldd --version | head -n 1
          g++ --version | head -n 1

      - name: Zig 0.16 (temor), checked against its published SHA-256
        run: desktop/release/install-zig.sh --version 0.16.0

      - name: rustup, checked against its published SHA-256 (release/install-rustup.sh)
        run: |
          set -euo pipefail
          desktop/release/install-rustup.sh
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Check out the manifest repos beside desktop
        env:
          RELEASE_READ_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          desktop/release/checkout.sh --siblings "$GITHUB_WORKSPACE"
          export PATH="$HOME/.cargo/bin:$PATH"
          # Each repo pins its own toolchain in rust-toolchain.toml (1.98.1 for the program as a whole).
          for f in */rust-toolchain.toml; do
            channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
            [ -z "$channel" ] || rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          done

      - name: The system files a release may place are slipway's list
        if: matrix.name == 'small'
        run: desktop/release/check-system-list.sh --slipway "$GITHUB_WORKSPACE/slipway"

      - name: Cache cargo and the build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/build/release/target
          # An exact key and no restore-keys: a cache is restored only for exactly this manifest, never by prefix, so a
          # cache written by another run cannot seed the build of what gets signed (a manifest change builds cold).
          key: cargo-ubuntu2404-${{ matrix.name }}-${{ hashFiles('desktop/manifest.toml') }}

      - name: Build and stage
        run: |
          set -euo pipefail
          desktop/release/build.sh --version "${{ needs.prepare.outputs.version }}" \
            --out "$GITHUB_WORKSPACE/desktop/build/release" --siblings "$GITHUB_WORKSPACE" --only "${{ matrix.only }}"
          # An artifact is a zip, which would drop the modes: ship the staged tree as a tar.
          tar -C desktop/build/release -cf "stage-${{ matrix.name }}.tar" stage components.d
          # slipway's three privileged programs are not in the bundle (a release must not replace a program that runs
          # as root), nor is its polkit file, but the smoke job needs the ones built from the same pin, on the same
          # oldest base (build.sh builds them with `-p slipway-root`). The user program rides along for the start-and-rollback scenarios.
          if [ "${{ matrix.name }}" = small ]; then
            mkdir helper
            for p in slipway-apply slipway-rollback slipway-health slipway; do
              cp "desktop/build/release/target/slipway/release/$p" helper/
            done
            cp "$GITHUB_WORKSPACE/slipway/dist/org.quire.slipway.policy" helper/
          fi

      - name: The C library the programs need is no newer than Ubuntu 24.04's
        run: |
          set -euo pipefail
          desktop/release/check-glibc.sh 2.39 --stage desktop/build/release/stage
          if [ -d helper ]; then desktop/release/check-glibc.sh 2.39 --stage helper; fi

      - name: Every shared library the programs name is installed
        run: |
          set -euo pipefail
          desktop/release/check-ldd.sh --stage desktop/build/release/stage
          if [ -d helper ]; then desktop/release/check-ldd.sh --stage helper; fi

      - name: Upload the staged tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-${{ matrix.name }}
          path: stage-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 3

      - name: Upload slipway's programs and polkit file (for the smoke job)
        if: matrix.name == 'small'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper
          path: helper/
          if-no-files-found: error
          retention-days: 3

  # Merges the staged trees, packs and signs them, and checks the result as slipway will.
  pack:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The signing key and its password live in this environment only (release/README.md, "What you do once").
    environment: release-signing
    steps:
      - name: Tools
        run: |
          sudo apt-get update
          # minisign 0.11 or later is needed to sign prehashed; pack.sh passes -H either way. (Ubuntu's version: unverified.)
          sudo apt-get install -y --no-install-recommends minisign zstd

      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop

      - name: The public key is committed, and the signing key is set up
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Before anything is signed: with no committed key nothing can be checked, and with no key in the environment
          # the environment is not set up.
          [ -f desktop/release/release.pub ] || { echo "release/release.pub is not committed (release/README.md step 3)" >&2; exit 1; }
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "the release-signing environment has no MINISIGN_SECRET_KEY (release/README.md step 5)" >&2; exit 1; }
          echo "Signing key id this release is checked against:"
          sed -n 1p desktop/release/release.pub

      - name: Download the staged trees
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stage-*
          merge-multiple: true
          path: staged

      - name: Merge them
        run: |
          set -euo pipefail
          mkdir -p desktop/build/release
          for t in staged/stage-*.tar; do tar -C desktop/build/release -xf "$t"; done
          cat desktop/build/release/components.d/*.txt >desktop/build/release/components.txt

      - name: Notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_NOTES" ]; then printf '%s\n' "$INPUT_NOTES"
          elif [ "$EVENT" = push ]; then
            git -C desktop fetch -q --force origin "+refs/tags/$REF_NAME:refs/tags/$REF_NAME"
            git -C desktop for-each-ref --format='%(contents)' "refs/tags/$REF_NAME"
          fi >notes.txt
          [ -s notes.txt ] || printf 'Release %s\n' "$VERSION" >notes.txt

      - name: Pack and sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/release.key"
          umask 022
          export MINISIGN_KEY_FILE="$RUNNER_TEMP/release.key"
          desktop/release/pack.sh --stage desktop/build/release/stage --version "$VERSION" --notes notes.txt \
            --out out --components desktop/build/release/components.txt
          rm -f "$RUNNER_TEMP/release.key"

      - name: Verify as slipway will
        run: |
          set -euo pipefail
          desktop/release/verify.sh out --pubkey desktop/release/release.pub

      - name: Keep the signed release for the smoke and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: |
            out/release.toml
            out/release.toml.minisig
            out/bundle.tar.zst
            notes.txt
          if-no-files-found: error
          retention-days: 3

  # Installs the signed release with slipway's helper in a clean container of each supported distribution and
  # checks what landed. The container is root on a throwaway file system, so the helper writes /etc, /usr and
  # /opt for real. No privileged container is needed: nothing here starts systemd or a sandbox. Steps that do
  # (unit start-up, the agent sandbox, bubblewrap) would need `options: --privileged` or a systemd-nspawn root
  # on the runner, which hosted runners may not allow (unverified), so they are not in this job.
  smoke:
    needs: [pack, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04, image: "ubuntu:24.04", family: debian }
          - { name: fedora-44, image: "fedora:44", family: fedora }
          - { name: arch, image: "archlinux:latest", family: arch }
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Git and certificates (the checkout needs them)
        run: |
          case "${{ matrix.family }}" in
            debian) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
            fedora) dnf -y install --setopt=install_weak_deps=False git ca-certificates ;;
            arch) pacman -Syu --noconfirm --needed git ca-certificates ;;
          esac

      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop

      - name: Tools and the libraries the programs load (this distribution's names, release/deps.sh)
        run: |
          set -euo pipefail
          pkgs=$(desktop/release/deps.sh ${{ matrix.family }} runtime)
          case "${{ matrix.family }}" in
            debian) apt-get install -y --no-install-recommends $pkgs ;;
            fedora) dnf -y install --setopt=install_weak_deps=False $pkgs ;;
            arch) pacman -S --noconfirm --needed $pkgs ;;
          esac

      - name: Download the signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: in/release

      - name: Download slipway's programs and polkit file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper
          path: in/helper

      - name: Install it and check what landed
        run: |
          set -euo pipefail
          # The artifact zip dropped the programs' executable bit.
          chmod 755 in/helper/slipway*
          desktop/release/smoke.sh --really --release in/release/out \
            --pubkey desktop/release/release.pub --helpers in/helper --policy in/helper/org.quire.slipway.policy

  # Two scenarios for the start check, with slipway's real programs: two good logins keep the newest release,
  # and restarts that never reach a confirmed start put the previous release back. A privileged container, because
  # the scenarios bind a made-up boot id over /proc (release/health-scenarios.sh says why); hosted runners are
  # expected to allow `--privileged` for a container job (unverified).
  health:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Git and certificates (the checkout needs them)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop

      - name: Tools
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends $(desktop/release/deps.sh debian tools) mount

      - name: Download slipway's programs and polkit file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper
          path: in/helper

      - name: Good starts are kept, failed starts restore the previous version
        run: |
          set -euo pipefail
          chmod 755 in/helper/slipway*
          desktop/release/health-scenarios.sh --really --helpers in/helper --policy in/helper/org.quire.slipway.policy

  # Only a release that installed on all three distributions, and whose start check works, is published.
  publish:
    needs: [prepare, smoke, health]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # RELEASES_TOKEN, which can create a release in desktop-releases, lives in this environment only.
    environment: release-publish
    steps:
      - name: Download the signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: in

      - name: Create the release in desktop-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The artifact keeps the paths it was given: out/... and notes.txt.
          cd in
          gh release create "v$VERSION" out/release.toml out/release.toml.minisig out/bundle.tar.zst \
            --repo PoHsuanLai/desktop-releases --title "Desktop $VERSION" --notes-file notes.txt
