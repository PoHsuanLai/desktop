# The version manifest: which revs of which repos are known to work together.
# Written 2026-10-03 (S0), refreshed the same day (S0-D2) to each repo's own branch tip (git rev-parse of
# the branch; the working trees were not consulted). casement-protocols is a private GitHub repo.
# `gate` is `lane` (the desktop gate runs ~/rs-wt/gate-lane-jailed.sh on a checkout at `rev`) or
# `none`. `gate_args` are the extra clippy/test args of that repo's lane gate (plan §6.3).
# `gate_extra` is a command run in the checkout, outside the jail, after the lane gate.
# [protocols] are the wire versions this set speaks; gate/manifest-check.sh compares them with
# what each repo declares once the repos declare them (S0-PZ onwards).

[protocols]
casement_protocols = 1
keycap = 1
palmrest = 1

[repo.quire]
url = "https://github.com/PoHsuanLai/quire.git"
rev = "faecc7ad7349e97cdc496f6b65081e67b8d5fedf"
branch = "master"
gate = "lane"
gate_extra = "./scripts/check-consumer.sh"

[repo.sill]
url = "https://github.com/PoHsuanLai/sill.git"
rev = "f6cef0e3157a446b248e2ed474c5aca7595d9927"
branch = "master"
gate = "lane"
gate_args = "--features sill/debug"

